  <style>
    :root {
      --bg-base: #0c0d10;
      --bg-surface: #14161d;
      --bg-card: #1c1f2b;
      --border-color: #2a2e3f;
      --text-main: #e2e8f0;
      --text-muted: #8a94a6;
      --accent-cyan: #00f0ff;
      --accent-magenta: #ff0055;
      --accent-amber: #ffb703;
      --hover-row: rgba(0, 240, 255, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header Styling */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 12px;
      height: 24px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta));
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      background-color: rgba(0, 240, 255, 0.1);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      padding: 5px 12px;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
    }

    /* Search & Controls */
    .controls {
      display: grid;
      grid-template-columns: 2fr repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    @media (max-width: 900px) {
      .controls {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .brand {
        justify-content: center;
      }
      .header-actions {
        width: 100%;
        justify-content: center;
        margin-top: 4px;
      }
      .controls {
        grid-template-columns: 1fr;
      }
      body {
        padding: 10px;
      }
      h1 {
        font-size: 1.1rem;
      }
    }

    input, select {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
    }

    /* Main Deck / Table Styling */
    .table-deck {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    th {
      background-color: var(--bg-card);
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 1px;
      padding: 14px 16px;
      font-weight: 700;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th:hover {
      color: var(--accent-cyan);
    }

    th .sort-icon {
      margin-left: 4px;
      opacity: 0.5;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: var(--hover-row);
    }

    /* Day Text & Badge Color Coding */
    .day-thursday { color: #ffb703; font-weight: 700; }
    .day-friday { color: #ff0055; font-weight: 700; }
    .day-saturday { color: #00f0ff; font-weight: 700; }
    .day-sunday { color: #00ff88; font-weight: 700; }
    .day-tbd { color: #b5179e; font-weight: 700; }

    .badge-day {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid currentColor;
      background: rgba(255,255,255,0.03);
    }

    /* Category Background Color Coding */
    .badge-category {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      display: inline-block;
      letter-spacing: 0.5px;
    }

    .cat-music {
      background-color: rgba(255, 0, 85, 0.15);
      border: 1px solid rgba(255, 0, 85, 0.4);
      color: #ff6699;
    }

    .cat-activity {
      background-color: rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #80f7ff;
    }

    .cat-workshop {
      background-color: rgba(255, 183, 3, 0.15);
      border: 1px solid rgba(255, 183, 3, 0.4);
      color: #ffd056;
    }

    .artist-name {
      font-weight: 600;
      color: #fff;
    }

    .time-slot {
      font-family: monospace;
      color: var(--accent-cyan);
    }

    /* Footer Stats */
    .table-footer {
      padding: 12px 16px;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-card);
      display: flex;
      justify-content: space-between;
    }

    /* Mobile Responsive Card Styling */
    @media (max-width: 768px) {
      .table-deck {
        background-color: transparent;
        border: none;
        box-shadow: none;
      }

      #scheduleTable, 
      #scheduleTable thead, 
      #scheduleTable tbody, 
      #scheduleTable tr, 
      #scheduleTable td {
        display: block;
        width: 100%;
      }

      #scheduleTable thead {
        display: none;
      }

      #scheduleTable tr {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        margin-bottom: 12px;
        padding: 14px;
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #scheduleTable td {
        padding: 0;
        border: none;
        white-space: normal;
      }

      /* Top Header Bar: Flexbox layout guarantees full span */
      td.card-top {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        width: 100% !important;
      }

      .card-top-left {
        flex: 1;
        text-align: left;
      }

      .card-time-center {
        flex: 1;
        font-family: monospace;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--accent-cyan);
        text-align: center;
      }

      .card-top-right {
        flex: 1;
        text-align: right;
      }

      /* Card Center: Camp Name Dimmed & Slightly Increased Size, Event/Artist Larger White Text */
      .card-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 4px;
        margin: 4px 0;
      }

      .card-host {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .card-title {
        font-size: 1.15rem;
        font-weight: 800;
        color: #fff;
      }

      /* Card Bottom (Details / Notes) */
      .card-details {
        font-size: 0.88rem;
        color: var(--text-muted);
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        padding-top: 8px;
        text-align: center;
      }
    }
  </style>

    let currentData = [...festivalData];
    let sortDirections = [true, true, true, true, true, true, true];

    // Helper for DJ/Artist preferred display
    function getEventTitle(row) {
      return (row.artist && row.artist !== '—') ? row.artist : row.event;
    }

    // Day Color Helper
    function getDayClass(day) {
      switch(day) {
        case 'Thursday': return 'day-thursday';
        case 'Friday': return 'day-friday';
        case 'Saturday': return 'day-saturday';
        case 'Sunday': return 'day-sunday';
        default: return 'day-tbd';
      }
    }

    // Category Color Helper
    function getCategoryClass(category) {
      if (category.includes('Music')) return 'cat-music';
      if (category.includes('Activity')) return 'cat-activity';
      if (category.includes('Workshop')) return 'cat-workshop';
      return '';
    }

    // Populate Dynamic Host Options
    function populateHosts() {
      const hostSelect = document.getElementById('filterHost');
      const hosts = [...new Set(festivalData.map(item => item.host))].sort();
      hosts.forEach(host => {
        const opt = document.createElement('option');
        opt.value = host;
        opt.textContent = host;
        hostSelect.appendChild(opt);
      });
    }

    // Render Table / Cards
    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      const isMobile = window.innerWidth <= 768;

      data.forEach((row, index) => {
        const tr = document.createElement('tr');
        tr.dataset.index = index;

        const displayTitle = getEventTitle(row);

        if (isMobile) {
          // Mobile Card Layout
          tr.innerHTML = `
            <td class="card-top">
              <span class="card-top-left"><span class="badge-day ${getDayClass(row.day)}">${row.day}</span></span>
              <span class="card-time-center">${row.time}</span>
              <span class="card-top-right"><span class="badge-category ${getCategoryClass(row.category)}">${row.category}</span></span>
            </td>
            <td class="card-center">
              <div class="card-host">${row.host}</div>
              <div class="card-title">${displayTitle}</div>
            </td>
            ${row.details ? `<td class="card-details">${row.details}</td>` : ''}
          `;
        } else {
          // Desktop Table Layout
          tr.innerHTML = `
            <td><span class="${getDayClass(row.day)}">${row.day}</span></td>
            <td class="time-slot">${row.time}</td>
            <td>${row.host}</td>
            <td>${row.event}</td>
            <td class="artist-name">${row.artist}</td>
            <td><span class="badge-category ${getCategoryClass(row.category)}">${row.category}</span></td>
            <td style="color: var(--text-muted);">${row.details}</td>
          `;
        }
        tbody.appendChild(tr);
      });

      document.getElementById('rowCount').textContent = `${data.length} Quests Await`;
      document.getElementById('showingCount').textContent = `Showing ${data.length} of ${festivalData.length} entries`;
    }

    // Global Filter Function
    function applyFilters() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const dayVal = document.getElementById('filterDay').value;
      const catVal = document.getElementById('filterCategory').value;
      const hostVal = document.getElementById('filterHost').value;

      currentData = festivalData.filter(item => {
        const matchesSearch = Object.values(item).some(val => val.toLowerCase().includes(searchVal));
        const matchesDay = dayVal === '' || item.day === dayVal;
        const matchesCat = catVal === '' || item.category === catVal;
        const matchesHost = hostVal === '' || item.host === hostVal;

        return matchesSearch && matchesDay && matchesCat && matchesHost;
      });

      renderTable(currentData);
    }

    // Column Sorting
    function sortTable(colIndex) {
      const keys = ['day', 'time', 'host', 'event', 'artist', 'category', 'details'];
      const key = keys[colIndex];
      const asciiDirection = sortDirections[colIndex];

      currentData.sort((a, b) => {
        let valA = a[key].toUpperCase();
        let valB = b[key].toUpperCase();

        if (valA < valB) return asciiDirection ? -1 : 1;
        if (valA > valB) return asciiDirection ? 1 : -1;
        return 0;
      });

      sortDirections[colIndex] = !asciiDirection;
      renderTable(currentData);
    }

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('filterDay').addEventListener('change', applyFilters);
    document.getElementById('filterCategory').addEventListener('change', applyFilters);
    document.getElementById('filterHost').addEventListener('change', applyFilters);

    window.addEventListener('resize', () => renderTable(currentData));

    // Initial Load & Sync
    populateHosts();
    applyFilters();
  </script>
